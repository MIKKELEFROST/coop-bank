name: Opdatér aktiekurser

# Henter kurser fra Nasdaq København og committer dem som data/aktier.json.
# Kører server-side, så der er hverken CORS-begrænsning eller API-nøgle
# involveret, og siden forbliver et rent statisk deploy.
#
# Bemærk: planlagte kørsler sker kun på default-branchen (main). På andre
# brancher kan workflowet startes manuelt under fanen Actions.

on:
  schedule:
    # Hverdage kl. 07:30, 11:30 og 16:30 UTC. Børsen i København har åbent
    # 09:00–17:00 dansk tid, så de tre kørsler rammer kort efter åbning, midt
    # på dagen og efter lukketid — også når sommertid forskyder tidszonen.
    - cron: '30 7,11,16 * * 1-5'
  workflow_dispatch:

# En kørsel ad gangen; to samtidige ville skændes om det samme commit.
concurrency:
  group: update-stocks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Hent kurser
        run: node scripts/fetch-stocks.mjs

      - name: Commit hvis der er ændringer
        run: |
          if git diff --quiet -- data/aktier.json; then
            echo "Ingen kursændringer — intet at committe."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aktier.json
          git commit -m "Opdatér aktiekurser ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
